<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Bucks Haven Farm crest">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2c98a"/>
      <stop offset=".45" stop-color="#c9a35c"/>
      <stop offset="1" stop-color="#9a763a"/>
    </linearGradient>
  </defs>
  <!-- outer ring -->
  <circle cx="60" cy="60" r="57" fill="none" stroke="url(#brass)" stroke-width="1.6"/>
  <circle cx="60" cy="60" r="52.5" fill="none" stroke="url(#brass)" stroke-width=".7" opacity=".7"/>
  <!-- horseshoe, heels up -->
  <path d="M 40 27.4 A 40 40 0 1 0 80 27.4 L 73.5 38.6 A 27 27 0 1 1 46.5 38.6 Z"
        fill="url(#brass)"/>
  <!-- nail holes -->
  <g fill="#10241a">
    <circle cx="31" cy="45.2" r="2.1"/>
    <circle cx="28.5" cy="73.5" r="2.1"/>
    <circle cx="48.5" cy="93.5" r="2.1"/>
    <circle cx="71.5" cy="93.5" r="2.1"/>
    <circle cx="91.5" cy="73.5" r="2.1"/>
    <circle cx="89" cy="45.2" r="2.1"/>
  </g>
  <!-- monogram -->
  <text x="60" y="72" text-anchor="middle"
        font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif"
        font-size="34" font-weight="600" letter-spacing="1"
        fill="url(#brass)">BH</text>
  <!-- star at the gap -->
  <path d="M60 16 l1.9 4.1 4.1 1.9 -4.1 1.9 -1.9 4.1 -1.9 -4.1 -4.1 -1.9 4.1 -1.9 Z" fill="url(#brass)"/>
</svg>
