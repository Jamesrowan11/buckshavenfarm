<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" role="img" aria-label="Bucks Haven Farm">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2c98a"/>
      <stop offset=".45" stop-color="#c9a35c"/>
      <stop offset="1" stop-color="#9a763a"/>
    </linearGradient>
  </defs>
  <!-- crest -->
  <g transform="translate(160,2) scale(0.84)">
    <path d="M 40 27.4 A 40 40 0 1 0 80 27.4 L 73.5 38.6 A 27 27 0 1 1 46.5 38.6 Z" fill="url(#brass)"/>
    <g fill="#10241a">
      <circle cx="31" cy="45.2" r="2.1"/>
      <circle cx="28.5" cy="73.5" r="2.1"/>
      <circle cx="48.5" cy="93.5" r="2.1"/>
      <circle cx="71.5" cy="93.5" r="2.1"/>
      <circle cx="91.5" cy="73.5" r="2.1"/>
      <circle cx="89" cy="45.2" r="2.1"/>
    </g>
    <text x="60" y="72" text-anchor="middle"
          font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif"
          font-size="34" font-weight="600" letter-spacing="1" fill="url(#brass)">BH</text>
    <path d="M60 16 l1.9 4.1 4.1 1.9 -4.1 1.9 -1.9 4.1 -1.9 -4.1 -4.1 -1.9 4.1 -1.9 Z" fill="url(#brass)"/>
  </g>
  <!-- wordmark -->
  <text x="210" y="146" text-anchor="middle"
        font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif"
        font-size="38" font-weight="600" letter-spacing="6" fill="#f5f0e6">BUCKS HAVEN</text>
  <!-- rules + subline -->
  <line x1="70" y1="166" x2="168" y2="166" stroke="url(#brass)" stroke-width="1"/>
  <line x1="252" y1="166" x2="350" y2="166" stroke="url(#brass)" stroke-width="1"/>
  <text x="210" y="171" text-anchor="middle"
        font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="12" letter-spacing="7" fill="url(#brass)">FARM</text>
  <text x="210" y="192" text-anchor="middle"
        font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="9" letter-spacing="4" fill="#b9c4ba">HIGHLAND · MARYLAND</text>
</svg>
