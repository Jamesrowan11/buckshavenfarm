#:schema node_modules/wrangler/config-schema.json

# OpenNext deploys this app to Cloudflare Workers with the Static Assets
# platform (the modern Workers platform with bundled static assets).
# This is NOT a Cloudflare Pages project — even though the URL says
# *.workers.dev, all server rendering and assets live here.

name = "buckshavenfarm"
main = ".open-next/worker.js"

compatibility_date = "2025-03-25"
compatibility_flags = ["nodejs_compat"]

# Static assets generated by OpenNext.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"
run_worker_first = true

# Public env vars baked into the build. Sensitive values still go via the
# Cloudflare dashboard (Workers > Settings > Variables). Listed here as
# documentation of the contract; actual values are bound at deploy time.
# NEXT_PUBLIC_SUPABASE_URL = "https://xtvwxgqrzswsuzouztkt.supabase.co"
# NEXT_PUBLIC_SUPABASE_ANON_KEY = "<bind via dashboard>"

[observability]
enabled = true
